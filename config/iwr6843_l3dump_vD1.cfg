% ============================================================================
% VARIANT D1 — B's timeline at half payload: 16 loops x 64 samples (9.4 cm)
%              x 12 frames x 6 ms = 72 ms window, 384 KB -> ~3.7 s dump
% ============================================================================
% The transfer-speed bet (2026-07-13): variant B won A/B/C on launch-angle
% stability; real-C showed 12 frames compensate for coarse bins. D1 combines
% both cuts: if LA quality matches B, we get sub-4 s turnaround.
% REQUIRES vD1 firmware (LOOPS=16 N_SAMPLES=64 RING_FRAMES=12).
flushCfg
dfeDataOutputMode 1
channelCfg 15 5 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 64 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
frameCfg 0 1 16 0 6 1 0
lowPower 0 0
sensorStart
