% ============================================================================
% VARIANT D2 — maximum frames: 16 loops x 64 samples (9.4 cm) x 24 frames
%              x 4 ms = 96 ms window, 768 KB, ~7.5 s dump, 4 ms frame spacing
% ============================================================================
% Tests whether frame density keeps buying launch-angle stability past 12.
% Window covers ~46 ms of pre-impact downswing (club data) + full flight.
% If sensorStart rejects the 4 ms period (BSS floor is ~3.5 ms), change
% frameCfg's 4 -> 5 and retest (window becomes 120 ms; fine).
% REQUIRES vD2 firmware (LOOPS=16 N_SAMPLES=64 RING_FRAMES=24).
flushCfg
dfeDataOutputMode 1
channelCfg 15 5 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 64 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
frameCfg 0 1 16 0 4 1 0
lowPower 0 0
sensorStart
