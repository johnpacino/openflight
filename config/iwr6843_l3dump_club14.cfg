% ============================================================================
% 3TX CLUB14 TEST CANDIDATE - 14 loops, 2.25 ms acquisition, phased storage
% ============================================================================
% phaseCaptureCfg:
%   preStart preBins preFrames impactStart impactBins impactFrames
%   postStart postBins lateStart ballFrames ballStride
%
% Nominal 4.6875 cm bins place bins 23-40 at roughly 3.5-6.2 ft. The
% pre-trigger ring and first six post-trigger frames keep that narrow club
% window at 2.25 ms spacing. The remaining ball frames use the proven 53-bin
% middle/late windows and retain every other acquisition at 4.5 ms spacing.
%
%   8 pre-impact frames x 18 bins =  96,768 bytes
%   6 impact frames x 18 bins    =  72,576 bytes
%   14 ball frames x 53 bins     = 498,624 bytes
%   total: 28 retained frames / 667,968 of 786,432 bytes
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 14 0 2.25 1 0
phaseCaptureCfg 23 18 8 23 18 6 32 53 47 14 2
lowPower 0 0
sensorStart
