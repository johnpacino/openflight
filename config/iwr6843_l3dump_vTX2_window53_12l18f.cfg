% ============================================================================
% 3TX WINDOWED SNAPSHOT - 12 loops, 18 frames, 4 ms frame spacing
% ============================================================================
% Stores 53 FFT range bins per frame using the firmware's validated dynamic
% early/middle/late windows. The 18-frame ring preserves six pre-trigger and
% twelve post-trigger frames.
%
%   3 TX x 12 loops x 18 frames x 4 RX x 53 bins x 4 bytes = 549,504 bytes
%
% Requires firmware built with:
%   N_TX=3 LOOPS=12 RING_FRAMES=18 HWA_POST_TRIGGER_FRAMES=12
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 4 1 0
lowPower 0 0
sensorStart
