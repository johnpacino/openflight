% Compression A/B candidate: same 24-frame, 3 ms movie as IQ16.
% Only captureFormat differs, isolating IQ8 quantization from movie geometry.
% Experimental: continuous packing did not sustain 3 ms cadence in field testing.
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat iq8
phaseCaptureCfg 20 53 9 32 53 7 47 53 47 8 1
lowPower 0 0
sensorStart
