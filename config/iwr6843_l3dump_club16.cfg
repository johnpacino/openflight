% ============================================================================
% 3TX CLUB16 SHELF CANDIDATE - 16 loops, 2.5 ms acquisition, phased storage
% ============================================================================
% phaseCaptureCfg:
%   preStart preBins preFrames impactStart impactBins impactFrames
%   postStart postBins lateStart ballFrames ballStride
%
% Nominal 4.6875 cm bins place bins 23-40 at roughly 3.5-6.2 ft. The
% pre-trigger ring and first six post-trigger frames keep that narrow club
% window at 2.5 ms spacing. The remaining ball frames use the proven 53-bin
% middle/late windows and retain every other acquisition at 5 ms spacing.
%
%   8 pre-impact frames x 18 bins = 110,592 bytes
%   6 impact frames x 18 bins    =  82,944 bytes
%   14 ball frames x 53 bins     = 569,856 bytes
%   total: 28 retained frames / 763,392 of 786,432 bytes
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 16 0 2.5 1 0
phaseCaptureCfg 23 18 8 23 18 6 32 53 47 14 2
lowPower 0 0
sensorStart
