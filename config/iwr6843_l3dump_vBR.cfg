% ============================================================================
% VARIANT B-REVERSED — causal TX-order experiment
% ============================================================================
% Identical to variant B except the two active TX masks are reversed in time:
% TX3 transmits first and TX1 transmits second. Keep the board orientation and
% all geometry unchanged. Host processing MUST use tx_order=reversed so the
% snapshots are restored to the calibration's original physical element order.
% Requires the same variant-B firmware as iwr6843_l3dump_vB.cfg.
flushCfg
dfeDataOutputMode 1
channelCfg 15 5 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 4
chirpCfg 1 1 0 0 0 0 0 1
frameCfg 0 1 16 0 6 1 0
lowPower 0 0
sensorStart
