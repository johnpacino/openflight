% ============================================================================
% VARIANT C — coarse bins, double frames: 64 samples (9.4 cm) x 32 loops
%             x 12 frames x 6 ms = 72 ms
% ============================================================================
% Frame-density experiment (2026-07-13): halves the sampled bandwidth by
% stopping the ADC at 64 samples (16 us) on the SAME 100 MHz/us ramp -> range
% bins 9.4 cm, max range still 6.0 m, ~3 dB less per-chirp integration.
% Chirp/loop timing IDENTICAL to production v3. Full 32 loops kept.
% REQUIRES the variant-C firmware (releases/l3_dump_vC-*.bin; built
% N_SAMPLES=64 RING_FRAMES=12) — the geometry guard rejects it elsewhere.
flushCfg
dfeDataOutputMode 1
channelCfg 15 5 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 64 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
frameCfg 0 1 32 0 6 1 0
lowPower 0 0
sensorStart
