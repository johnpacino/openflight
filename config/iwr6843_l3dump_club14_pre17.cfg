% ============================================================================
% 3TX CLUB14 LONG-PRE CANDIDATE - 14 loops, 2.25 ms acquisition
% ============================================================================
% phaseCaptureCfg:
%   preStart preBins preFrames impactStart impactBins impactFrames
%   postStart postBins lateStart ballFrames ballStride
%
% Seventeen narrow pre-trigger frames retain 38.25 ms of circular history.
% With the measured 12-14 ms impact-to-freeze latency, this leaves roughly
% 24-26 ms of physical pre-impact club data. The six narrow frames following
% the freeze are near-range post-trigger frames; ball storage then uses the
% proven 53-bin middle/late windows at a retained 4.5 ms cadence.
%
%   17 pre-trigger frames x 18 bins = 205,632 bytes
%    6 near post frames x 18 bins   =  72,576 bytes
%   14 ball frames x 53 bins        = 498,624 bytes
%   total: 37 retained frames / 776,832 of 786,432 bytes
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 14 0 2.25 1 0
phaseCaptureCfg 23 18 17 23 18 6 32 53 47 14 2
lowPower 0 0
sensorStart
