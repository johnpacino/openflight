% ============================================================================
% 3TX CLUB14 LONG-PRE CANDIDATE - 14 loops, 2.25 ms acquisition
% ============================================================================
% phaseCaptureCfg:
%   preStart preBins preFrames impactStart impactBins impactFrames
%   postStart postBins lateStart ballFrames ballStride
%
% Seventeen narrow pre-trigger frames retain 38.25 ms of circular history.
% With the measured 12-14 ms impact-to-freeze latency, this leaves roughly
% 24-26 ms of physical pre-impact club data. One narrow frame following the
% freeze preserves the phase boundary, then ball storage switches immediately
% to the proven 53-bin middle/late windows at a retained 4.5 ms cadence. This
% starts wide ball capture 11.25 ms earlier than the six-frame schedule.
%
%   17 pre-trigger frames x 18 bins = 205,632 bytes
%    1 near post frame x 18 bins    =  12,096 bytes
%   15 ball frames x 53 bins        = 534,240 bytes
%   total: 33 retained frames / 751,968 of 786,432 bytes
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 14 0 2.25 1 0
phaseCaptureCfg 23 18 17 23 18 1 32 53 47 15 2
lowPower 0 0
sensorStart
