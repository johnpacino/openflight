% ============================================================================
% VARIANT B — half loops, double frames: 16 loops x 12 frames x 6 ms = 72 ms
% ============================================================================
% Frame-density experiment (2026-07-13): same 768 KB ring, same 7.5 s dump,
% but 12 looks at the flight 6 ms apart instead of 6 looks 12 ms apart.
% Chirp profile and timing IDENTICAL to production v3 — only the loop count
% and frame period change. REQUIRES the variant-B firmware
% (releases/l3_dump_vB-*.bin; built LOOPS=16 RING_FRAMES=12) — the firmware
% geometry guard rejects this cfg on any other build.
flushCfg
dfeDataOutputMode 1
channelCfg 15 5 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
frameCfg 0 1 16 0 6 1 0
lowPower 0 0
sensorStart
