% ============================================================================
% OpenFlight Stage-1c L3-dump RF config — IWR6843L EVM, custom l3_dump firmware
% ============================================================================
% Sent to the firmware's CLI (mmWave extension) once at session start; the
% firmware's "sensorStart" then opens+configs+starts the front-end, which then
% free-runs. Contains ONLY the RF-link commands the CLI mmWave extension
% understands — none of the stock-demo point-cloud/driver commands (guiMonitor,
% cfarCfg, adcbufCfg, bpmCfg, clutterRemoval, ...) which the custom firmware
% does not implement (and does not need: the Pi does all processing).
%
% Chirp profile mirrors config/iwr6843_levm_ball.cfg (the ball-tracking preset):
%   channelCfg 15 5  -> 4 RX + 2 TX (TX0+TX2, the elevation pair)
%   profileCfg ...128 4000 -> 128 samples @ 4 Msps, 100 MHz/us, 60.0 GHz start
%   frameCfg 0 1 32 ... 12 -> 32 loops x 2 TX = 64 chirps/frame, 12 ms period
% Frame period 12 ms x 5-frame ring = 60 ms window: covers the full indoor
% flight (tee ~2.2 m -> net ~4.7 m, ~55 ms at 9i speeds). Burst stays 2.88 ms;
% the period costs no L3. MUST match l3host.FRAME_S (track fit uses it).
% Geometry MUST stay in sync with l3_dump.c (N_TX/N_RX/N_SAMPLES/LOOPS) and the
% Pi meta (iwr6843_l3dump).
flushCfg
dfeDataOutputMode 1
channelCfg 15 5 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
frameCfg 0 1 32 0 12 1 0
lowPower 0 0
sensorStart
