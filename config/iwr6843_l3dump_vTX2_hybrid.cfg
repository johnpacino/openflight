% ============================================================================
% 3TX HYBRID CADENCE - 12 loops, 2 ms acquisition, 4 ms retained ball frames
% ============================================================================
% captureCfg:
%   preStart preBins postStart postBins lateStart postFrames [postStride]
%
% The HWA acquires every frame with all 12 loops. Before the sound-trigger
% freeze request, every 2 ms frame is retained in the 32-bin club window.
% After the request, postStride=2 retains every other acquisition in the wider
% 53-bin ball window, preserving 12-loop snapshots at 4 ms spacing.
%
%   16 pre-impact frames x 32 bins = 294,912 bytes
%   16 post-impact frames x 53 bins = 488,448 bytes
%   total: 32 retained frames / 783,360 of 786,432 bytes
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 2 1 0
% The hybrid firmware defaults postStride to 2. Omitting the optional value
% keeps this config compatible with the original hybrid release.
captureCfg 20 32 32 53 47 16
lowPower 0 0
sensorStart
