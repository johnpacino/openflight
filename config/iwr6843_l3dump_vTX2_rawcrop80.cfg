% ============================================================================
% VARIANT TX2 RAWCROP80 — 3TX rolling-buffer shrink proof
% ============================================================================
% RF geometry intentionally matches vTX2:
%
%   3 TX x 10 loops x 12 frames x 4 RX x 128 acquired samples
%
% The matching firmware is built with SAVE_SAMPLES=80, so EDMA copies only 80
% raw ADC samples per RX channel into L3:
%
%   3 TX x 10 loops x 12 frames x 4 RX x 80 saved samples x 4 bytes
%   = 460,800 bytes
%
% This is a plumbing proof, not the final range-bin crop. True fixed range-bin
% crop will store selected FFT range bins after range processing.
%
% Requires firmware built with:
%   N_TX=3 LOOPS=10 RING_FRAMES=12 SAVE_SAMPLES=80
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 10 0 6 1 0
lowPower 0 0
sensorStart
