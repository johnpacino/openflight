% ============================================================================
% 3TX CONFIGURABLE SNAPSHOT - 12 loops, 3 ms frame spacing
% ============================================================================
% captureCfg:
%   preStart preBins postStart postBins lateStart postFrames
%
% With the settings below, the firmware automatically uses the remaining L3:
%   16 pre-impact frames x 32 bins = 294,912 bytes
%   16 post-impact frames x 53 bins = 488,448 bytes
%   total: 32 frames / 96 ms / 783,360 of 786,432 bytes
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureCfg 20 32 32 53 47 16
lowPower 0 0
sensorStart
