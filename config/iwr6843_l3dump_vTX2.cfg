% ============================================================================
% VARIANT TX2 — 3TX proof for vertical + horizontal/aim snapshots
% ============================================================================
% Adds TX2 to the existing TX1 + TX3 capture pattern so each TDM loop contains
% three chirps: TX1, TX2, TX3. To stay inside the 768 KiB L3 ring, this config
% uses 10 loops x 12 frames at 6 ms spacing:
%
%   3 TX x 10 loops x 12 frames x 4 RX x 128 samples x 4 bytes = 737,280 bytes
%
% Requires firmware built with:
%   N_TX=3 LOOPS=10 RING_FRAMES=12
%
% This is a hardware/data-capture proof. Host-side horizontal/aim estimation
% still needs to consume the third TX snapshots explicitly.
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 10 0 6 1 0
lowPower 0 0
sensorStart
