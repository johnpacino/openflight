% IWR6843 on-chip shadow-candidate static-reflector diagnostic.
% Keeps the hybrid IQ16 frame movie unchanged and adds one candidate record
% per retained frame. Bins 26-39 cover approximately 4.0-6.0 ft slant range
% with the 3.2 GHz profile; min power is intentionally zero for empty/target
% comparison. Do not use this permissive static gate as a production club gate.
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 14 0 2.25 1 0
phaseCaptureCfg 23 18 17 23 18 1 32 53 47 15 2
shadowCfg 26 14 0
lowPower 0 0
sensorStart
