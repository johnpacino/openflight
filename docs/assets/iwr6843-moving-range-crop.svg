<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Moving 53-bin range crop across an 18-frame radar movie</title>
  <desc id="desc">Eighteen radar frames arranged in three groups. Each full 128-bin range FFT is shown in gray while an unmodified 53-bin crop shifts from the tee toward late flight. A memory bar shows 549,504 bytes used and 236,928 bytes remaining.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#edf6f2"/>
    </linearGradient>
    <linearGradient id="cropEarly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7e2d4"/>
      <stop offset="1" stop-color="#f2c8aa"/>
    </linearGradient>
    <linearGradient id="cropLate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dceee9"/>
      <stop offset="1" stop-color="#b9ddd4"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="620" rx="24" fill="url(#background)"/>
  <text x="48" y="50" fill="#17332d" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="600">Cropping each frame of the radar movie</text>
  <text x="50" y="80" fill="#667771" font-family="Avenir Next, Gill Sans, sans-serif" font-size="15">The HWA develops all 128 range bins. Firmware stores the useful 53-bin corridor, with every retained complex value unchanged.</text>

  <g font-family="SFMono-Regular, Menlo, monospace" font-size="10" fill="#667771">
    <text x="78" y="117">RADAR 0 m</text>
    <text x="245" y="117">TEE 1.58 m</text>
    <text x="494" y="117">MID 3.0 m</text>
    <text x="756" y="117">NET 4.6 m</text>
    <text x="966" y="117">6.0 m</text>
  </g>
  <line x1="78" y1="126" x2="1022" y2="126" stroke="#cfd8d4" stroke-width="2"/>
  <g stroke="#cfd8d4" stroke-width="1">
    <line x1="78" y1="121" x2="78" y2="132"/>
    <line x1="326" y1="121" x2="326" y2="132"/>
    <line x1="550" y1="121" x2="550" y2="132"/>
    <line x1="802" y1="121" x2="802" y2="132"/>
    <line x1="1022" y1="121" x2="1022" y2="132"/>
  </g>

  <g font-family="Avenir Next, Gill Sans, sans-serif">
    <g transform="translate(48,150)">
      <rect width="328" height="300" rx="16" fill="#fffdf7" stroke="#d7ddd8"/>
      <rect x="18" y="18" width="86" height="23" rx="11.5" fill="#f7e2d4"/>
      <text x="61" y="34" text-anchor="middle" fill="#d96c2f" font-size="11" font-weight="700">PRE-IMPACT</text>
      <text x="18" y="67" fill="#17332d" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="600">Frames 1-6</text>
      <text x="18" y="90" fill="#667771" font-size="13">Early crop · bins 20-72 · 0.94-3.38 m</text>
      <g transform="translate(18,112)">
        <g transform="translate(0,0)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="46" width="121" height="21" rx="5" fill="url(#cropEarly)"/><circle cx="119" cy="10.5" r="5" fill="#d96c2f"/></g>
        <g transform="translate(0,29)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="46" width="121" height="21" rx="5" fill="url(#cropEarly)"/><circle cx="121" cy="10.5" r="5" fill="#d96c2f"/></g>
        <g transform="translate(0,58)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="46" width="121" height="21" rx="5" fill="url(#cropEarly)"/><circle cx="123" cy="10.5" r="5" fill="#d96c2f"/></g>
        <g transform="translate(0,87)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="46" width="121" height="21" rx="5" fill="url(#cropEarly)"/><circle cx="125" cy="10.5" r="5" fill="#d96c2f"/></g>
        <g transform="translate(0,116)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="46" width="121" height="21" rx="5" fill="url(#cropEarly)"/><circle cx="127" cy="10.5" r="5" fill="#d96c2f"/></g>
        <g transform="translate(0,145)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="46" width="121" height="21" rx="5" fill="url(#cropEarly)"/><circle cx="129" cy="10.5" r="5" fill="#d96c2f"/></g>
      </g>
      <text x="18" y="289" fill="#667771" font-size="11">Full gray strip = computed · colored strip = stored</text>
    </g>

    <g transform="translate(396,150)">
      <rect width="328" height="300" rx="16" fill="#fffdf7" stroke="#d7ddd8"/>
      <rect x="18" y="18" width="92" height="23" rx="11.5" fill="#efe9d9"/>
      <text x="64" y="34" text-anchor="middle" fill="#8a6a31" font-size="11" font-weight="700">EARLY FLIGHT</text>
      <text x="18" y="67" fill="#17332d" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="600">Frames 7-12</text>
      <text x="18" y="90" fill="#667771" font-size="13">Middle crop · bins 32-84 · 1.50-3.94 m</text>
      <g transform="translate(18,112)">
        <g transform="translate(0,0)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="73" width="121" height="21" rx="5" fill="#efe3c6"/><circle cx="135" cy="10.5" r="5" fill="#b57a2a"/></g>
        <g transform="translate(0,29)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="73" width="121" height="21" rx="5" fill="#efe3c6"/><circle cx="144" cy="10.5" r="5" fill="#b57a2a"/></g>
        <g transform="translate(0,58)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="73" width="121" height="21" rx="5" fill="#efe3c6"/><circle cx="153" cy="10.5" r="5" fill="#b57a2a"/></g>
        <g transform="translate(0,87)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="73" width="121" height="21" rx="5" fill="#efe3c6"/><circle cx="162" cy="10.5" r="5" fill="#b57a2a"/></g>
        <g transform="translate(0,116)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="73" width="121" height="21" rx="5" fill="#efe3c6"/><circle cx="171" cy="10.5" r="5" fill="#b57a2a"/></g>
        <g transform="translate(0,145)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="73" width="121" height="21" rx="5" fill="#efe3c6"/><circle cx="180" cy="10.5" r="5" fill="#b57a2a"/></g>
      </g>
      <text x="18" y="289" fill="#667771" font-size="11">The crop advances after the impact freeze request</text>
    </g>

    <g transform="translate(744,150)">
      <rect width="328" height="300" rx="16" fill="#fffdf7" stroke="#d7ddd8"/>
      <rect x="18" y="18" width="88" height="23" rx="11.5" fill="#dceee9"/>
      <text x="62" y="34" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="700">LATE FLIGHT</text>
      <text x="18" y="67" fill="#17332d" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="600">Frames 13-18</text>
      <text x="18" y="90" fill="#667771" font-size="13">Late crop · bins 47-99 · 2.20-4.64 m</text>
      <g transform="translate(18,112)">
        <g transform="translate(0,0)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="107" width="121" height="21" rx="5" fill="url(#cropLate)"/><circle cx="188" cy="10.5" r="5" fill="#0f766e"/></g>
        <g transform="translate(0,29)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="107" width="121" height="21" rx="5" fill="url(#cropLate)"/><circle cx="196" cy="10.5" r="5" fill="#0f766e"/></g>
        <g transform="translate(0,58)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="107" width="121" height="21" rx="5" fill="url(#cropLate)"/><circle cx="204" cy="10.5" r="5" fill="#0f766e"/></g>
        <g transform="translate(0,87)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="107" width="121" height="21" rx="5" fill="url(#cropLate)"/><circle cx="212" cy="10.5" r="5" fill="#0f766e"/></g>
        <g transform="translate(0,116)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="107" width="121" height="21" rx="5" fill="url(#cropLate)"/><circle cx="220" cy="10.5" r="5" fill="#0f766e"/></g>
        <g transform="translate(0,145)"><rect width="292" height="21" rx="5" fill="#eef0ed"/><rect x="107" width="121" height="21" rx="5" fill="url(#cropLate)"/><circle cx="226" cy="10.5" r="5" fill="#0f766e"/></g>
      </g>
      <text x="18" y="289" fill="#667771" font-size="11">Late evidence stays just short of the home net</text>
    </g>
  </g>

  <g transform="translate(48,484)" font-family="Avenir Next, Gill Sans, sans-serif">
    <text x="0" y="0" fill="#17332d" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="600">768 KiB on-chip L3 budget</text>
    <rect x="0" y="22" width="1024" height="42" rx="10" fill="#dceee9"/>
    <rect x="0" y="22" width="715" height="42" rx="10" fill="#d96c2f"/>
    <text x="20" y="49" fill="#fffdf7" font-size="13" font-weight="700">549,504 B · 3 TX · 12 loops · 18 frames · 4 ms</text>
    <text x="858" y="49" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="700">236,928 B free</text>
    <text x="0" y="91" fill="#667771" font-size="13">The saved bytes buy more looks per frame, six dense pre-impact frames, and twelve post-impact frames without changing the 4.7 cm range resolution.</text>
  </g>
</svg>
