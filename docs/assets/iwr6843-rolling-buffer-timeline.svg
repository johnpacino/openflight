<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">IWR6843 rolling buffer frame timeline</title>
  <desc id="desc">A 12 frame rolling-buffer capture showing impact clutter, early ball frames, cleaner late ball frames selected by LCMF, and a net/screen boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#ecf5f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17332d" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1120" height="360" rx="24" fill="url(#bg)"/>
  <text x="48" y="50" fill="#17332d" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="600">Custom firmware rolling buffer</text>
  <text x="50" y="80" fill="#667771" font-family="Avenir Next, Gill Sans, sans-serif" font-size="15">A short radar movie, not one snapshot · 12 frames · about 6 ms apart · LCMF favors cleaner late-flight evidence</text>

  <line x1="68" y1="262" x2="1038" y2="262" stroke="#d7ddd8" stroke-width="3"/>
  <polygon points="1038,262 1024,254 1024,270" fill="#d7ddd8"/>
  <text x="520" y="294" fill="#667771" font-family="SFMono-Regular, Menlo, monospace" font-size="12">true chronological order after ring-buffer unwrap</text>

  <g font-family="SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">
    <g transform="translate(68,126)">
      <rect width="62" height="112" rx="10" fill="#fffdf7" stroke="#d7ddd8"/>
      <text x="31" y="132" fill="#667771">F-3</text>
      <circle cx="24" cy="80" r="4" fill="#c8d0cc"/>
      <circle cx="39" cy="73" r="3" fill="#c8d0cc"/>
      <circle cx="35" cy="91" r="3" fill="#c8d0cc"/>
    </g>
    <g transform="translate(146,126)">
      <rect width="62" height="112" rx="10" fill="#fffdf7" stroke="#d7ddd8"/>
      <text x="31" y="132" fill="#667771">F-2</text>
      <circle cx="22" cy="84" r="3" fill="#c8d0cc"/>
      <circle cx="42" cy="68" r="4" fill="#c8d0cc"/>
      <circle cx="31" cy="96" r="3" fill="#c8d0cc"/>
    </g>
    <g transform="translate(224,126)">
      <rect width="62" height="112" rx="10" fill="#fff7ee" stroke="#d96c2f"/>
      <text x="31" y="132" fill="#d96c2f">impact</text>
      <path d="M16 92 C28 50, 42 118, 52 58" fill="none" stroke="#d96c2f" stroke-width="3" opacity="0.55"/>
      <circle cx="28" cy="70" r="5" fill="#d96c2f" opacity="0.55"/>
      <circle cx="42" cy="93" r="4" fill="#d96c2f" opacity="0.45"/>
    </g>
    <g transform="translate(302,126)">
      <rect width="62" height="112" rx="10" fill="#fff7ee" stroke="#e8d7b7"/>
      <text x="31" y="132" fill="#667771">+6 ms</text>
      <circle cx="24" cy="86" r="5" fill="#d96c2f"/>
      <circle cx="38" cy="90" r="4" fill="#d96c2f" opacity="0.55"/>
      <circle cx="44" cy="63" r="3" fill="#c8d0cc"/>
    </g>
    <g transform="translate(380,126)">
      <rect width="62" height="112" rx="10" fill="#fff7ee" stroke="#e8d7b7"/>
      <text x="31" y="132" fill="#667771">+12</text>
      <circle cx="31" cy="78" r="5" fill="#d96c2f"/>
      <circle cx="44" cy="88" r="4" fill="#d96c2f" opacity="0.55"/>
      <circle cx="20" cy="97" r="3" fill="#c8d0cc"/>
    </g>
    <g transform="translate(458,126)">
      <rect width="62" height="112" rx="10" fill="#fffdf7" stroke="#d7ddd8"/>
      <text x="31" y="132" fill="#667771">+18</text>
      <circle cx="34" cy="69" r="5" fill="#d96c2f"/>
      <circle cx="46" cy="87" r="4" fill="#d96c2f" opacity="0.45"/>
    </g>
    <g transform="translate(536,126)">
      <rect width="62" height="112" rx="10" fill="#ecf5f1" stroke="#0f766e" stroke-width="2"/>
      <text x="31" y="132" fill="#0f766e">+24</text>
      <circle cx="36" cy="61" r="5" fill="#0f766e"/>
      <circle cx="49" cy="84" r="4" fill="#0f766e" opacity="0.48"/>
    </g>
    <g transform="translate(614,126)">
      <rect width="62" height="112" rx="10" fill="#ecf5f1" stroke="#0f766e" stroke-width="2"/>
      <text x="31" y="132" fill="#0f766e">+30</text>
      <circle cx="38" cy="53" r="5" fill="#0f766e"/>
      <circle cx="50" cy="82" r="4" fill="#0f766e" opacity="0.42"/>
    </g>
    <g transform="translate(692,126)">
      <rect width="62" height="112" rx="10" fill="#ecf5f1" stroke="#0f766e" stroke-width="2"/>
      <text x="31" y="132" fill="#0f766e">+36</text>
      <circle cx="41" cy="46" r="5" fill="#0f766e"/>
      <circle cx="51" cy="79" r="4" fill="#0f766e" opacity="0.38"/>
    </g>
    <g transform="translate(770,126)">
      <rect width="62" height="112" rx="10" fill="#ecf5f1" stroke="#0f766e" stroke-width="2"/>
      <text x="31" y="132" fill="#0f766e">+42</text>
      <circle cx="43" cy="39" r="5" fill="#0f766e"/>
      <circle cx="52" cy="78" r="4" fill="#0f766e" opacity="0.34"/>
    </g>
    <g transform="translate(848,126)">
      <rect width="62" height="112" rx="10" fill="#ecf5f1" stroke="#0f766e" stroke-width="2"/>
      <text x="31" y="132" fill="#0f766e">+48</text>
      <circle cx="45" cy="33" r="5" fill="#0f766e"/>
      <circle cx="53" cy="77" r="4" fill="#0f766e" opacity="0.3"/>
    </g>
    <g transform="translate(926,126)">
      <rect width="62" height="112" rx="10" fill="#fffdf7" stroke="#d7ddd8"/>
      <text x="31" y="132" fill="#667771">+54</text>
      <circle cx="46" cy="29" r="4" fill="#0f766e" opacity="0.78"/>
      <circle cx="53" cy="76" r="3" fill="#0f766e" opacity="0.22"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="226" y="96" width="128" height="28" rx="14" fill="#f7e2d4"/>
    <text x="290" y="115" text-anchor="middle" fill="#d96c2f" font-family="Avenir Next, Gill Sans, sans-serif" font-size="13" font-weight="700">impact clutter</text>
    <rect x="528" y="96" width="392" height="28" rx="14" fill="#dceee9"/>
    <text x="724" y="115" text-anchor="middle" fill="#0f766e" font-family="Avenir Next, Gill Sans, sans-serif" font-size="13" font-weight="700">cleaner late-flight frames selected for LCMF</text>
  </g>

  <g>
    <line x1="1032" y1="112" x2="1032" y2="246" stroke="#d96c2f" stroke-width="5" stroke-dasharray="9 7"/>
    <text x="1032" y="100" text-anchor="middle" fill="#d96c2f" font-family="SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">net/screen</text>
  </g>

  <text x="68" y="326" fill="#667771" font-family="Avenir Next, Gill Sans, sans-serif" font-size="14">Orange = early/impact-dominated evidence. Teal = later snapshots where direct and floor-reflected paths separate more cleanly.</text>
</svg>
